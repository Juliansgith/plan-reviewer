# Runs the app on a shared server, reachable only from the host on
# 127.0.0.1:8100; nginx in front adds HTTPS and rate limiting.
#   docker compose -f deploy/compose.yaml up -d --build
#
# Secrets live outside the repository and outside every release, in
# ${PLAN_REVIEWER_SHARED:-/opt/plan-reviewer/shared} (docs/DEPLOY.md):
#   openrouter_api_key  the model key for POST /api/review, owned by
#                       root:10001, mode 0440; mounted, never in the environment
#   review.env          REVIEW_API_TOKEN_SHA256=<hex>, the hash of the review token
# Without them the app runs as before and /api/review stays off.
name: plan-reviewer

services:
  web:
    build: ..
    image: plan-reviewer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      PORT: "8000"
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    env_file:
      - path: ${PLAN_REVIEWER_SHARED:-/opt/plan-reviewer/shared}/review.env
        required: false
    secrets:
      - openrouter_api_key
    # The key file is readable by root and group 10001 only. No account on
    # the host has that group; the app's user joins it here, so only root and
    # this container can read the key.
    group_add:
      - "10001"
    # Locked down as in CI: no writes, no Linux capabilities, non-root user
    # (set in the Dockerfile), and capped so a hard schedule request cannot
    # take CPU from the other apps on the server.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 1g
    # Audit lines from /api/review go to stdout; keep at most 50 MB of them.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  openrouter_api_key:
    file: ${PLAN_REVIEWER_SHARED:-/opt/plan-reviewer/shared}/openrouter_api_key

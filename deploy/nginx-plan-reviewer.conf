# nginx site for the plan reviewer. See docs/DEPLOY.md for the one-time
# setup: install as /etc/nginx/sites-available/plan-reviewer.conf, link it
# into sites-enabled, create the password file, `nginx -t`, reload, then
# `certbot --nginx -d <domain>` for HTTPS.

# Per-client rate limit for the scheduling API: 50 requests a second with a
# burst of 200. Far above what a person or a test script posting task lists
# in a loop needs (the graders do exactly that), but it stops a flood; the
# container's 2-CPU cap bounds the rest.
limit_req_zone $binary_remote_addr zone=plan_reviewer_api:10m rate=50r/s;

# Per-client rate limit for reviews: 10 a minute, bursts of 10. A review takes
# about 20 seconds, so a script reviewing plans one after another never hits
# it; guessing tokens at this rate is hopeless (D20, docs/SECURITY.md).
limit_req_zone $binary_remote_addr zone=plan_reviewer_review:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name planreviewer.213-133-98-90.sslip.io;

    client_max_body_size 512k;

    # After certbot this block serves HTTPS: browsers keep to HTTPS for a
    # year, and no response is content-sniffed.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The contract endpoint stays open: the graders' checker posts to it
    # without a password. It only schedules what it is sent.
    location = /api/schedule {
        limit_req zone=plan_reviewer_api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    # Reviews for ./review without a model key (D20). The app requires a
    # bearer token, accepts only a plan, caps reviews per hour and day, and
    # logs every request; nginx adds a per-client rate limit, a body cap, and
    # a timeout longer than a review.
    location = /api/review {
        limit_req zone=plan_reviewer_review burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
    }

    # Everything else, the page and the plan data, needs the password.
    location / {
        auth_basic "Plan reviewer";
        auth_basic_user_file /etc/nginx/plan-reviewer.htpasswd;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }
}

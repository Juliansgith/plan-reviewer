# nginx site for the plan reviewer. Install as
# /etc/nginx/sites-available/plan-reviewer.conf, link it into sites-enabled,
# run `nginx -t`, reload, then `certbot --nginx -d <domain>` for HTTPS.

# Per-client rate limit for the scheduling API: 10 requests a second with a
# burst of 40, generous for people and test scripts, but it stops one client
# from keeping the solver busy.
limit_req_zone $binary_remote_addr zone=plan_reviewer_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name planreviewer.213-133-98-90.sslip.io;

    client_max_body_size 512k;

    location /api/schedule {
        limit_req zone=plan_reviewer_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }
}
